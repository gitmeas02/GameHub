<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Canvas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="app"></canvas>
    <div class="controls">
        <button id="left">Left</button>
        <button id="right">Right</button>
        <button id="bottom">Down</button>
        <button id="top">Up</button>
        <button id="bounce">Bounce</button>
        <button id="stopBounce">Stop Bounce</button>
        <button id="teleport">teleport</button>
        <button id="randomPostion">randomPostion</button>
     <button id="cubeClone">Cube Clone</button>
<button id="resetClone">Cube Reset</button>

    </div>
    <script src="./index6.js"></script>
</body>
</html>

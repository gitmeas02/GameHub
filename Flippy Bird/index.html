<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Game</title>
    <style>
    body {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }
        .game-play {
            position: relative;
            width: 100%;
            height: 700px;
            background: url("./img/LightBackground.png");
            background-size: contain;
            overflow: hidden;
        }
        .bird {
            width: 3.6rem;
            position: absolute;
            top: 50%;
            left: 33%;
            transform: translate(-50%, -50%);
        }
        .pipe {
            position: absolute;
            width: 3rem;
        }
        .pipe-top {
            top: 0;
            right: -10%;
        }
        .pipe-bottom {
            bottom: 0;
            right: -10%;
        }
        .pipe {
            animation: movePipe 4.3s linear infinite;
        }
        .pause-menu, .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left:50%;
            transform: translate(-50%,-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }
        @keyframes movePipe {
            0% {
                left: 100%;
            }
            100% {
                left: -65%;
            }
        }
        .pipe {
    animation: movePipe 16s linear infinite;
}
@media (max-width: 1198px) {
    @keyframes movePipe {
        0% {
            left: 150%;
        }
        100% {
            left: -120%; /* Make sure pipes fully exit the screen */
        }
    }

    .pipe {
        animation-duration: 10s; /* Adjust speed for smaller screens */
    }
}
.score {
    font-size: 24px;
    color: white;
    background: rgba(0, 0, 0, 0.5);
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: bold;
}

    </style>
    </style>
</head>
<body>
    <div class="game-play">
        <div class="score" id="score-game-play"
        style="
      
        font-size: 24px;
        right: 0rem;
        top:0rem;
        /* transform: translate(-); */
        color: white;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px 20px;
        border-radius: 10px;
        font-weight: bold;
        ">
        >Score: 0</div>
        <img src="./img/Red_bird.png" alt="Bird" class="bird" id="bird">

        <!-- Pipes -->
        <img class="pipe pipe-top" src="./img/PipeGreen.png" alt="" style="height: 17rem;">
        <img class="pipe pipe-bottom" src="./img/PipRed.png" alt="" style="height: 14rem;">
        <img class="pipe pipe-top" src="./img/PipeGreen.png" alt="" style="height: 15rem; margin-left: 220px;">
        <img class="pipe pipe-bottom" src="./img/PipRed.png" alt="" style="height: 14rem; margin-left: 210px;">
        <img class="pipe pipe-top" src="./img/PipeGreen.png" alt="" style="height: 17rem; margin-left: 420px;">
        <img class="pipe pipe-bottom" src="./img/PipRed.png" alt="" style="height: 14rem; margin-left: 410px;">
        <img class="pipe pipe-top" src="./img/PipeGreen.png" alt="" style="height: 17rem; margin-left: 610px;">
        <img class="pipe pipe-bottom" src="./img/PipRed.png" alt="" style="height: 14rem; margin-left: 610px;">
        <img class="pipe pipe-top" src="./img/PipeGreen.png" alt="" style="height: 11rem; margin-left: 820px;">
        <img class="pipe pipe-bottom" src="./img/PipRed.png" alt="" style="height: 14rem; margin-left: 810px;">
        <img class="pipe pipe-top" src="./img/PipeGreen.png" alt="" style="height: 17rem; margin-left: 1020px;">
        <img class="pipe pipe-bottom" src="./img/PipRed.png" alt="" style="height: 14rem; margin-left: 1010px;">
    </div>
    <div class="pause-menu">
        <p>Game Paused</p>
        <button id="continue-btn">Continue</button>
        <button id="exit-btn">Exit</button>
    </div>
    <div class="game-over">
        <div class="score" id="score-game-over">Score: 0</div>
        Game Over! Press <span id="restart-text">R</span> to Restart or <span id="exit-text">E</span> to Exit
    </div>
    <audio id="background-music" src="./youtube_vJwKKKd2ZYE_audio.mp3" loop></audio>
    <script>
        const sound = document.getElementById('background-music');
        const bird = document.querySelector('.bird');
        const pipes = document.querySelectorAll('.pipe');
        let birdTop = window.innerHeight / 2;
        let velocityY = 0;
        const gravity = 0.13;
        let currentGravity = gravity;
        let lift = -3.7;
        const minTop = 0;
        const maxTop = 700 - bird.clientHeight;
        let isGameOver = false;
        let isPaused = false;
        let passedPipes = 0;
        let loopCount = 0;
        let totalScore = 0;
        const scoreElementGamePlay = document.getElementById('score-game-play');
        const scoreElementGameOver = document.getElementById('score-game-over');

        function controlMusic() {
            if (isPaused || isGameOver) {
                sound.pause();
            } else {
                sound.play();
            }
        }
        
        // Ensure sound starts only after user interaction
        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space' && !isPaused && !isGameOver) {
                sound.play(); // Start background music when the player starts moving
            }
        });
// Track animation iterations for each pipe
pipes.forEach(pipe => {
    pipe.addEventListener('animationiteration', () => {
        // Do nothing here; we control the loop count in the updateScore function
    });
});

function updateScore() {
    passedPipes++; // Increase the number of pipes passed

    // Every 10 pipes, increment the loop count
    if (passedPipes % 10 === 0) {
        loopCount++;  // Increment loop count after 10 pipes
        console.log(`Loop count: ${loopCount}`); // Log loop count after passing 10 pipes
    }

    // Set total score to be equal to the loop count
    totalScore = loopCount; // Now, total score is equal to the loop count

    // Update score display
    scoreElementGamePlay.innerText = "Score: " + totalScore;
    scoreElementGameOver.innerText = "Score: " + totalScore;
}



        function applyGravity() {
            velocityY += currentGravity; // Apply gravity to the vertical velocity
            birdTop += velocityY; // Update bird's vertical position based on velocityY

            if (birdTop >= maxTop) { // Prevent the bird from going below the ground
                birdTop = maxTop;
                velocityY = 0; // Stop falling if we reach the bottom
                gameOver(); // Trigger game over if the bird hits the bottom
            } else if (birdTop <= minTop) { // Prevent the bird from going above the screen
                birdTop = minTop;
                velocityY = 0; // Stop upwards movement if we reach the top
            }
        }

        function updatePosition() {
            if (!isPaused && !isGameOver) {
                bird.style.top = birdTop + 'px';
                applyGravity();
                checkCollision();
                updateScore();
                requestAnimationFrame(updatePosition); // Keep updating the position for smooth animation
            }
        }

        document.addEventListener('keydown', function (event) {
            if (event.code === 'Space' && !isPaused && !isGameOver) {
                velocityY = lift; // Apply the lift when space is pressed
            }
            if (event.code === 'KeyR' && isGameOver) {
                restartGame(); // Restart the game if R is pressed and the game is over
            }
            if (event.code === 'KeyP') {
                togglePause(); // Toggle pause when P is pressed
            }
            if (event.code === 'KeyC' && isPaused) {
                togglePause(); // Toggle pause when C is pressed
            }
        });

        function gameOver() {
            isGameOver = true;
            document.querySelector('.game-over').style.display = 'block';
            stopPipes(); // Stop pipes when game is over
            controlMusic();
        }

        function togglePause() {
            if (isPaused) {
                isPaused = false;
                document.querySelector('.pause-menu').style.display = 'none';
                requestAnimationFrame(updatePosition); // Resume the game and bird's movement
                startPipes(); // Resume pipes animation
            } else {
                isPaused = true;
                document.querySelector('.pause-menu').style.display = 'block';
                stopPipes(); // Stop pipes and bird movement when paused
                controlMusic();
            }
        }

        function restartGame() {
            isGameOver = false;
            birdTop = window.innerHeight / 2; // Reset bird to center vertically
            velocityY = 0; // Reset bird's vertical speed
            currentGravity = gravity; // Reset gravity
            passedPipes = 0;  // Reset pipes passed
            loopCount = 0;     // Reset loop count
            totalScore = 0;    // Reset total score
            scoreElementGamePlay.innerText = "Score: 0";
            scoreElementGameOver.innerText = "Score: 0";
            document.querySelector('.game-over').style.display = 'none';

            resetPipes(); // Reset pipe positions
            applyGravity(); // Restart gravity effect
            requestAnimationFrame(updatePosition);
            controlMusic(); // Resume bird movement
        }

        function resetPipes() {
            pipes.forEach(pipe => {
                pipe.style.animation = 'none'; // Stop animation temporarily
                pipe.offsetHeight; // Trigger reflow to restart animation
                pipe.style.animation = null; // Restart animation
                pipe.scored = false; // Reset the scored flag
            });
        }

        function stopPipes() {
            pipes.forEach(pipe => {
                pipe.style.animationPlayState = 'paused'; // Pause pipe animations when paused
            });
        }

        function startPipes() {
            pipes.forEach(pipe => {
                pipe.style.animationPlayState = 'running'; // Resume pipe animations when continuing
            });
        }

        function checkCollision() {
            const birdRect = bird.getBoundingClientRect();
            let passedPipe = false;

            pipes.forEach(pipe => {
                const pipeRect = pipe.getBoundingClientRect();
                if (
                    birdRect.left < pipeRect.left + pipeRect.width &&
                    birdRect.left + birdRect.width > pipeRect.left &&
                    birdRect.top < pipeRect.top + pipeRect.height &&
                    birdRect.top + birdRect.height > pipeRect.top
                ) {
                    gameOver(); // Trigger game over if collision occurs
                    return true;
                }

                if (!pipe.scored && birdRect.left > pipeRect.left + pipeRect.width) {
                    pipe.scored = true;
                    passedPipe = true;
                }
            });

            if (passedPipe) {
                updateScore();
            }

            return false;
        }

        // Start the smooth animation loop
        requestAnimationFrame(updatePosition);

        // Event listeners for pause menu buttons
        document.getElementById('continue-btn').addEventListener('click', function () {
            togglePause(); // Toggle pause when continue button is pressed
        });
        document.getElementById('exit-btn').addEventListener('click', function () {
            // Handle exit logic here
            console.log("Exit game logic here");
        });
    </script>
</body>
</html>
